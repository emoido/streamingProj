<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Radio Calico">
  <defs>
    <radialGradient id="rc-disc" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#eafbe8"/>
      <stop offset="60%" stop-color="#d8f2d5"/>
      <stop offset="100%" stop-color="#bfe6bd"/>
    </radialGradient>
    <linearGradient id="rc-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cc0ba"/>
      <stop offset="100%" stop-color="#2f8d88"/>
    </linearGradient>
  </defs>

  <!-- Disc -->
  <circle cx="60" cy="60" r="56" fill="url(#rc-disc)" stroke="#1f4e23" stroke-width="6"/>

  <!-- Headphone band -->
  <path d="M28 60a32 30 0 0 1 64 0" fill="none" stroke="#1f4e23" stroke-width="6" stroke-linecap="round"/>

  <!-- Cat head -->
  <g stroke="#231f20" stroke-width="2.4" stroke-linejoin="round">
    <!-- ears -->
    <path d="M40 44 L37 24 L55 38 Z" fill="#ffffff"/>
    <path d="M80 44 L83 24 L65 38 Z" fill="#efa63c"/>
    <path d="M41 41 L39.5 30 L49 38 Z" fill="#f4b765" stroke="none"/>
    <path d="M79 41 L80.5 30 L71 38 Z" fill="#f7d9ad" stroke="none"/>

    <!-- face -->
    <path d="M60 36
             c-15 0 -24 10 -24 26
             c0 16 11 26 24 26
             c13 0 24 -10 24 -26
             c0 -16 -9 -26 -24 -26 Z" fill="#ffffff"/>

    <!-- calico patches -->
    <path d="M60 36 c-9 0 -16 4 -20 11 c5 3 12 4 20 4 c2 -6 2 -11 0 -15 Z" fill="#efa63c" stroke="none"/>
    <path d="M84 62 c0 13 -8 22 -18 25 c6 -8 9 -17 9 -27 c4 -1 7 -1 9 2 Z" fill="#231f20" stroke="none" opacity="0.92"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="51" cy="62" rx="4.2" ry="5.4" fill="#1f4e23"/>
    <ellipse cx="69" cy="62" rx="4.2" ry="5.4" fill="#1f4e23"/>
    <circle cx="52.4" cy="60.2" r="1.4" fill="#fff"/>
    <circle cx="70.4" cy="60.2" r="1.4" fill="#fff"/>
  </g>

  <!-- nose + mouth -->
  <path d="M57 71 h6 l-3 3 Z" fill="#efa63c" stroke="#231f20" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M60 74 v3 M60 77 c-2 0 -3.5 -1 -4 -2 M60 77 c2 0 3.5 -1 4 -2"
        fill="none" stroke="#231f20" stroke-width="1.6" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#231f20" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M44 70 L31 67 M44 73 L31 74"/>
    <path d="M76 70 L89 67 M76 73 L89 74"/>
  </g>

  <!-- ear cups -->
  <rect x="20" y="52" width="16" height="22" rx="7" fill="url(#rc-cup)" stroke="#1f4e23" stroke-width="3"/>
  <rect x="84" y="52" width="16" height="22" rx="7" fill="url(#rc-cup)" stroke="#1f4e23" stroke-width="3"/>
</svg>
