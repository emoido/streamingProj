<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaveHub — Choose your stream</title>
  <meta name="description" content="WaveHub — lossless radio and live TV." />
  <link rel="icon" type="image/png" href="/WaveHubLogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">
      <img src="/WaveHubLogo.png" alt="WaveHub" class="brand-logo" />
      <span class="brand-name">WaveHub</span>
    </a>
  </header>

  <main class="chooser">
    <div class="chooser-head">
      <h1>What would you like to watch?</h1>
      <p>Pick a stream to get started.</p>
    </div>

    <div class="choice-grid">
      <a class="choice-card choice-radio" href="/radio.html">
        <span class="choice-icon" aria-hidden="true">📻</span>
        <span class="choice-title">Radio</span>
        <span class="choice-desc">Lossless 24-bit music, ad-free</span>
        <span class="choice-go">Listen now →</span>
      </a>

      <a class="choice-card choice-tv" href="/tv.html">
        <span class="choice-icon" aria-hidden="true">📺</span>
        <span class="choice-title">TV — TRT 1</span>
        <span class="choice-desc">Live Turkish television in HD</span>
        <span class="choice-go">Watch now →</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    <p>Kick back and enjoy — crystal-clear audio and live TV.</p>
  </footer>
</body>
</html>
